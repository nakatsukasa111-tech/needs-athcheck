<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeeDS フィジカルチェック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#EDEEF0; --panel:#FFFFFF; --ink:#16202B; --ink-2:#5B6875; --line:#D3D7DC;
  --red:#C7453F; --amber:#D89A1F; --green:#3B8F68;
  --red-bg:#F7E5E4; --amber-bg:#FAF0DC; --green-bg:#E2F0E9;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
  font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
.num{font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit}

/* ---------- 骨格 ---------- */
header{
  background:var(--ink); color:#fff; padding:14px 20px;
  display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;
}
header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.04em}
header .sub{font-size:12px;color:#9AA7B4}
nav{display:flex;gap:2px;background:var(--ink);padding:0 20px 0}
nav button{
  background:none;border:0;color:#9AA7B4;padding:9px 18px;border-bottom:3px solid transparent;
  font-weight:500;
}
nav button.on{color:#fff;border-bottom-color:var(--amber)}
nav button:disabled{opacity:.35;cursor:not-allowed}
main{max-width:1080px;margin:0 auto;padding:24px 20px 80px}
.view{display:none}
.view.on{display:block}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
h2{font-size:16px;margin:0 0 14px;font-weight:700}
h3{font-size:13px;margin:22px 0 10px;font-weight:700;color:var(--ink-2)}
p.help{color:var(--ink-2);font-size:13px;margin:0 0 14px}

/* ---------- フォーム ---------- */
.row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;color:var(--ink-2)}
.f input,.f select{
  border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:#fff;width:150px;
}
.f input:focus,.f select:focus{outline:2px solid var(--ink);outline-offset:1px}
.btn{
  background:var(--ink);color:#fff;border:0;border-radius:4px;padding:10px 20px;font-weight:700;
}
.btn:hover{background:#0d1620}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- 会員リスト ---------- */
.mlist{border:1px solid var(--line);border-radius:4px;max-height:320px;overflow:auto}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:#F5F6F8}
.mrow .meta{font-size:12px;color:var(--ink-2)}

/* ---------- 測定入力 ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{
  border:1px solid var(--line);background:#fff;border-radius:100px;padding:7px 16px;color:var(--ink-2);
}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grp{display:none}
.grp.on{display:block}
.item{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #E7E9EC;flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item .nm{flex:1;min-width:160px}
.item .side{font-size:12px;color:var(--ink-2);width:20px}
.pts{display:flex;gap:4px}
.pts button{
  width:38px;height:34px;border:1px solid var(--line);background:#fff;border-radius:4px;font-weight:700;
}
.pts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.item input[type=number]{width:92px;border:1px solid var(--line);border-radius:4px;padding:7px 9px;text-align:right}
.unit{font-size:12px;color:var(--ink-2);width:42px}
.est{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:4px}

/* ---------- 結果 ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.who{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.who .name{font-size:24px;font-weight:700}
.who .tag{font-size:12px;color:var(--ink-2)}
.total{border-left:4px solid var(--ink);padding-left:14px;margin:18px 0}
.total .v{font-size:46px;font-weight:700;line-height:1}
.total .l{font-size:12px;color:var(--ink-2)}
.bars{margin-top:6px}
.bar{margin-bottom:12px}
.bar .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar .track{height:8px;background:#E3E5E9;border-radius:100px;overflow:hidden}
.bar .fill{height:100%;border-radius:100px}
.chip{display:inline-block;padding:1px 9px;border-radius:100px;font-size:11px;font-weight:700}
.c-red{background:var(--red-bg);color:var(--red)}
.c-amber{background:var(--amber-bg);color:#A9760D}
.c-green{background:var(--green-bg);color:var(--green)}
table.res{width:100%;border-collapse:collapse;font-size:14px}
table.res th{text-align:left;font-size:12px;color:var(--ink-2);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
table.res td{padding:7px 8px;border-bottom:1px solid #E7E9EC}
table.res td.v{text-align:right;width:110px}
.flags li{margin-bottom:6px}
.flags .lv{font-weight:700;margin-right:6px}
.note{background:#F5F6F8;border-left:3px solid var(--line);padding:12px 14px;font-size:14px;margin-bottom:10px;border-radius:0 4px 4px 0}
.empty{color:var(--ink-2);font-size:14px}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 22px;border-radius:4px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;
}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <h1>NeeDS フィジカルチェック</h1>
  <span class="sub" id="apiState">接続中…</span>
  <button onclick="showSetup();go(1)" style="margin-left:auto;background:none;border:1px solid #3C4A58;color:#9AA7B4;border-radius:4px;padding:4px 12px;font-size:12px">接続設定</button>
</header>
<nav>
  <button id="nav1" class="on" onclick="go(1)">選手を選ぶ</button>
  <button id="nav2" onclick="go(2)" disabled>測定を入力</button>
  <button id="nav3" onclick="go(3)" disabled>結果を見る</button>
</nav>

<main>

<!-- ============ 1. 会員 ============ -->
<section id="v1" class="view on">
  <div class="panel" id="setup" style="display:none">
    <h2>最初に接続先を設定する</h2>
    <p class="help">1回だけの作業です。このブラウザに保存されるので、次回からは入力不要です。</p>
    <div class="row">
      <div class="f" style="flex:1"><label for="s_url">Apps Script のデプロイURL（末尾が /exec）</label><input id="s_url" style="width:100%" placeholder="https://script.google.com/macros/s/.../exec"></div>
    </div>
    <div class="row">
      <div class="f"><label for="s_token">合言葉（ACCESS_TOKEN）</label><input id="s_token" style="width:280px"></div>
    </div>
    <button class="btn" onclick="saveConfig()">保存して接続する</button>
  </div>

  <div class="panel">
    <h2>選手を探す</h2>
    <p class="help">名前の一部を入れると候補が出ます。初めての選手は下から登録してください。</p>
    <div class="row">
      <div class="f"><label for="q">名前・かな・会員番号</label><input id="q" oninput="doSearch()" placeholder="なかつか"></div>
    </div>
    <div class="mlist" id="mlist"><div class="mrow"><span class="empty">読み込み中…</span></div></div>
  </div>

  <div class="panel">
    <h2>新しい選手を登録する</h2>
    <div class="row">
      <div class="f"><label for="n_name">氏名</label><input id="n_name"></div>
      <div class="f"><label for="n_kana">かな</label><input id="n_kana"></div>
      <div class="f"><label for="n_sex">性別</label><select id="n_sex"><option value="M">男性</option><option value="F">女性</option></select></div>
      <div class="f"><label for="n_bd">生年月日</label><input id="n_bd" type="date"></div>
      <div class="f"><label for="n_sport">競技種目</label><input id="n_sport" placeholder="野球"></div>
    </div>
    <button class="btn" onclick="addMember()">登録する</button>
  </div>
</section>

<!-- ============ 2. 測定入力 ============ -->
<section id="v2" class="view">
  <div class="panel">
    <h2 id="inputWho">測定を入力</h2>
    <p class="help">測っていない項目は空欄のままにしてください。空欄は採点の対象から外れます。</p>
    <div class="row">
      <div class="f"><label for="m_date">測定日</label><input id="m_date" type="date"></div>
      <div class="f"><label for="m_h">身長</label><input id="m_h" type="number" step="0.1" placeholder="cm"></div>
      <div class="f"><label for="m_w">体重</label><input id="m_w" type="number" step="0.1" placeholder="kg"></div>
      <div class="f"><label for="m_bf">体脂肪率</label><input id="m_bf" type="number" step="0.1" placeholder="%"></div>
      <div class="f"><label for="m_tr">担当</label><input id="m_tr"></div>
    </div>
    <div class="row">
      <div class="f" style="flex:1"><label for="m_inj">怪我・障害</label><input id="m_inj" style="width:100%" placeholder="右膝に違和感 など"></div>
    </div>
  </div>

  <div class="panel">
    <div class="tabs" id="tabs"></div>
    <div id="groups"></div>
    <div style="margin-top:22px;display:flex;gap:10px">
      <button class="btn" onclick="saveMeasurement()">採点して保存する</button>
      <button class="btn ghost" onclick="scoreOnly()">保存せず結果を見る</button>
    </div>
  </div>
</section>

<!-- ============ 3. 結果 ============ -->
<section id="v3" class="view">
  <div class="panel">
    <div class="who">
      <span class="name" id="r_name">—</span>
      <span class="tag" id="r_tag"></span>
    </div>
    <div class="hero">
      <div><canvas id="radar" height="330"></canvas></div>
      <div>
        <div class="total">
          <div class="v num" id="r_total">—</div>
          <div class="l">総合スコア（100点満点）</div>
        </div>
        <div class="bars" id="r_bars"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>ジャンプの中身</h2>
    <div id="r_jump"></div>
  </div>

  <div class="panel">
    <h2>気をつけたい点</h2>
    <ul class="flags" id="r_flags"></ul>
  </div>

  <div class="panel">
    <h2>項目ごとの結果</h2>
    <div id="r_items"></div>
  </div>

  <div class="panel" id="trendPanel">
    <h2>これまでの推移</h2>
    <div id="r_trendWrap"><canvas id="trend" height="220"></canvas></div>
  </div>
</section>

</main>
<div class="toast" id="toast"></div>

<script>
/* ==================================================================
   設定 — 画面から入力する。ファイルの書き換えは不要。
   ================================================================== */
var API_URL = localStorage.getItem('needs_api_url') || '';
var TOKEN   = localStorage.getItem('needs_token')   || '';

function showSetup(){
  $('setup').style.display='block';
  $('s_url').value = API_URL;
  $('s_token').value = TOKEN;
  $('apiState').textContent = '接続先が未設定です';
}
function saveConfig(){
  var u=$('s_url').value.trim(), t=$('s_token').value.trim();
  if(!u || !t){ toast('URLと合言葉の両方を入れてください'); return; }
  if(u.indexOf('/exec')<0){ toast('URLの末尾が /exec になっているか確認してください'); return; }
  localStorage.setItem('needs_api_url', u);
  localStorage.setItem('needs_token', t);
  API_URL=u; TOKEN=t;
  $('setup').style.display='none';
  boot();
}

/* ==================================================================
   項目定義
   ================================================================== */

// 柔軟性：部位ごとに3種目。左右がある種目は低いほうを採用する。
var FLEX = {
  upper: {label:'上半身', items:[
    {key:'banzai',      name:'バンザイ',   pair:true},
    {key:'kettai',      name:'結帯動作',   pair:true},
    {key:'shoulder_er', name:'肩関節外旋', pair:true}
  ]},
  core: {label:'体幹部', items:[
    {key:'trunk_rot',  name:'体幹回旋', pair:true},
    {key:'trunk_side', name:'体幹側屈', pair:true},
    {key:'bridge',     name:'ブリッジ', pair:false}
  ]},
  lower: {label:'下半身', items:[
    {key:'split',             name:'開脚',     pair:false},
    {key:'aslr',              name:'ASLR',     pair:true},
    {key:'ground_touch_flex', name:'地面タッチ', pair:false}
  ]}
};

var QUALITY = [
  {key:'sq_quality',   name:'スクワット'},
  {key:'slide_sq',     name:'スライドスクワット'},
  {key:'rot_sq',       name:'ローテーションスクワット'},
  {key:'rot_drill_up', name:'ローテーションドリル 上'},
  {key:'rot_drill_low',name:'ローテーションドリル 下'}
];

// 実測系：thresholds シートの item_key と一致させる
var MEASURED = {
  balance: {label:'バランス', items:[
    {key:'sl_stance',        name:'片脚立位',         unit:'秒', pair:true},
    {key:'ground_touch_bal', name:'地面タッチ',       unit:'回', pair:true}
  ]},
  strength: {label:'筋力', groups:[
    {sub:'体幹部', items:[
      {key:'ab30s',    name:'30秒腹筋',      unit:'回'},
      {key:'pl_basic', name:'PLベーシック',  unit:'回'},
      {key:'pushup',   name:'プッシュアップ', unit:'回'}
    ]},
    {sub:'上半身', items:[
      {key:'chinup', name:'懸垂',           unit:'回'},
      {key:'bp_1rm', name:'ベンチプレス 1RM', unit:'kg', bw:true, est:true}
    ]},
    {sub:'下半身', items:[
      {key:'sq_1rm', name:'スクワット 1RM',   unit:'kg', bw:true, est:true},
      {key:'dl_1rm', name:'デッドリフト 1RM', unit:'kg', bw:true, est:true},
      {key:'sl_sq',  name:'SLスクワット',    unit:'回', pair:true}
    ]}
  ]},
  jump: {label:'ジャンプ', items:[
    {key:'sqj',      name:'スクワットジャンプ', unit:'cm'},
    {key:'cmj',      name:'CMJ',              unit:'cm'},
    {key:'abj',      name:'ABJ',              unit:'cm'},
    {key:'sl_cmj',   name:'SLCMJ',            unit:'cm', pair:true},
    {key:'hop_rsi',  name:'ホップテスト',      unit:'RSI'},
    {key:'drop_rsi', name:'ドロップジャンプ',   unit:'RSI'}
  ]}
};

var CATS = [
  {key:'flex',     label:'柔軟性'},
  {key:'balance',  label:'バランス'},
  {key:'strength', label:'筋力'},
  {key:'jump',     label:'ジャンプ'},
  {key:'quality',  label:'動きの質'}
];

/* ==================================================================
   状態
   ================================================================== */
var TH = {};     // "item|sex|band" -> {red, green, unit, name}
var RULES = {};  // rule_key -> value
var member = null, history = [], form = {}, est = {}, result = null;
var radarChart = null, trendChart = null;

function $(id){return document.getElementById(id)}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},2200)}
function rule(k,d){return RULES[k]!==undefined?Number(RULES[k]):d}

/* ==================================================================
   通信
   ================================================================== */
function fail(where, e){
  console.error(where, e);
  var msg = String(e && e.message ? e.message : e);
  $('apiState').textContent = where+'に失敗：'+msg;
  toast(where+'に失敗しました。画面上部の表示を確認してください。');
}

function api(action, params){
  var u = API_URL+'?token='+encodeURIComponent(TOKEN)+'&action='+action;
  for(var k in params){ u += '&'+k+'='+encodeURIComponent(params[k]); }
  return fetch(u).then(function(r){return r.json()});
}
function post(body){
  body.token = TOKEN;
  return fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // CORS対策
    body:JSON.stringify(body)
  }).then(function(r){return r.json()});
}

function boot(){
  if(location.protocol === 'file:'){
    $('apiState').textContent = 'ファイルを直接開いています。この状態では通信できません。';
    return;
  }
  if(!API_URL || !TOKEN){ showSetup(); return; }
  api('bootstrap',{}).then(function(d){
    if(!d.ok){ $('apiState').textContent='接続できません：'+(d.error||''); return; }
    d.thresholds.forEach(function(t){
      TH[t.item_key+'|'+t.sex+'|'+t.age_band] = {
        red:Number(t.red_max), green:Number(t.green_min), unit:t.unit, name:t.item_name
      };
    });
    d.rules.forEach(function(r){ RULES[r.rule_key] = r.value; });
    $('apiState').textContent = '基準 '+d.thresholds.length+'件を読み込みました';
    doSearch();
  }).catch(function(e){
    $('apiState').textContent = '接続できません。URLと合言葉を確認してください。';
  });
}

/* ==================================================================
   画面1：会員
   ================================================================== */
function go(n){
  [1,2,3].forEach(function(i){
    $('v'+i).classList.toggle('on', i===n);
    $('nav'+i).classList.toggle('on', i===n);
  });
  window.scrollTo(0,0);
}

var searchTimer=null;
function doSearch(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){
    api('searchMembers',{q:$('q').value}).then(function(d){
      var el=$('mlist');
      if(!d.ok || !d.members.length){
        el.innerHTML='<div class="mrow"><span class="empty">該当する選手がいません。下から登録してください。</span></div>';
        return;
      }
      el.innerHTML = d.members.map(function(m){
        return '<div class="mrow" onclick="pick(\''+m.member_id+'\')">'
             + '<span><strong>'+esc(m.name)+'</strong> <span class="meta">'+esc(m.sport||'')+'</span></span>'
             + '<span class="meta num">'+esc(m.member_id)+'</span></div>';
      }).join('');
    }).catch(function(e){ fail('選手の検索', e); });
  }, 250);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function addMember(){
  var name=$('n_name').value.trim();
  if(!name){ toast('氏名を入れてください'); return; }
  post({action:'createMember', member:{
    name:name, kana:$('n_kana').value.trim(), sex:$('n_sex').value,
    birth_date:$('n_bd').value, sport:$('n_sport').value.trim()
  }}).then(function(d){
    if(!d.ok){ fail('選手の登録', d.error||'不明なエラー'); return; }
    ['n_name','n_kana','n_bd','n_sport'].forEach(function(i){$(i).value=''});
    toast(d.member.name+' さんを登録しました');
    pick(d.member.member_id);
  }).catch(function(e){ fail('選手の登録', e); });
}

function pick(id){
  $('apiState').textContent = '読み込み中…';
  api('history',{member_id:id}).then(function(d){
    if(!d.ok){ fail('履歴の読み込み', d.error||'不明なエラー'); return; }
    if(!d.member){ fail('履歴の読み込み', '会員 '+id+' が見つかりません'); return; }
    member = d.member; history = d.measurements || [];
    form = {}; est = {};
    $('nav2').disabled=false; $('nav3').disabled=false;
    $('inputWho').textContent = member.name+' さんの測定（'+(history.length+1)+'回目）';
    $('m_date').value = new Date().toISOString().slice(0,10);
    var last = history[history.length-1];
    if(last){ $('m_h').value=last.height||''; }
    buildInput();
    $('apiState').textContent = member.name+' さんを読み込みました';
    go(2);
  }).catch(function(e){ fail('履歴の読み込み', e); });
}

/* ==================================================================
   画面2：入力
   ================================================================== */
function band(){
  if(!member || !member.birth_date) return 'adult';
  var b=new Date(member.birth_date), d=new Date($('m_date').value||new Date());
  var a=d.getFullYear()-b.getFullYear();
  var m=d.getMonth()-b.getMonth();
  if(m<0||(m===0&&d.getDate()<b.getDate())) a--;
  return a >= rule('age_band_border',17) ? 'adult' : 'junior';
}
function th(key){ return TH[key+'|'+(member?member.sex:'M')+'|'+band()] || null; }

function buildInput(){
  var tabs=[
    {id:'g_flex',  label:'柔軟性'},
    {id:'g_bal',   label:'バランス'},
    {id:'g_str',   label:'筋力'},
    {id:'g_jmp',   label:'ジャンプ'},
    {id:'g_qua',   label:'動きの質'}
  ];
  $('tabs').innerHTML = tabs.map(function(t,i){
    return '<button class="'+(i===0?'on':'')+'" onclick="tab(\''+t.id+'\',this)">'+t.label+'</button>';
  }).join('');

  var h='';
  // 柔軟性
  h+='<div class="grp on" id="g_flex">';
  for(var p in FLEX){
    h+='<h3>'+FLEX[p].label+'</h3>';
    FLEX[p].items.forEach(function(it){ h+=ptsRow(it); });
  }
  h+='</div>';
  // バランス
  h+='<div class="grp" id="g_bal">';
  MEASURED.balance.items.forEach(function(it){ h+=numRow(it); });
  h+='</div>';
  // 筋力
  h+='<div class="grp" id="g_str">';
  MEASURED.strength.groups.forEach(function(g){
    h+='<h3>'+g.sub+'</h3>';
    g.items.forEach(function(it){ h+=numRow(it); });
  });
  h+='</div>';
  // ジャンプ
  h+='<div class="grp" id="g_jmp">';
  MEASURED.jump.items.forEach(function(it){ h+=numRow(it); });
  h+='</div>';
  // 動きの質
  h+='<div class="grp" id="g_qua">';
  QUALITY.forEach(function(it){ h+=ptsRow({key:it.key,name:it.name,pair:false}); });
  h+='</div>';

  $('groups').innerHTML=h;
}
function tab(id,btn){
  document.querySelectorAll('.grp').forEach(function(g){g.classList.toggle('on', g.id===id)});
  document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on', b===btn)});
}

function ptsRow(it){
  function one(field,side){
    var b='';
    [0,1,2,3].forEach(function(v){
      b+='<button onclick="setPt(\''+field+'\','+v+',this)">'+v+'</button>';
    });
    return '<div class="item"><span class="nm">'+it.name+'</span>'
         + '<span class="side">'+(side||'')+'</span><div class="pts" data-f="'+field+'">'+b+'</div></div>';
  }
  return it.pair ? one(it.key+'_R','右')+one(it.key+'_L','左') : one(it.key,'');
}
function setPt(field,v,btn){
  form[field]=v;
  var wrap=btn.parentNode;
  wrap.querySelectorAll('button').forEach(function(b){b.classList.toggle('on', b===btn)});
}

function numRow(it){
  function one(field,side){
    var e = it.est ? '<label class="est"><input type="checkbox" onchange="est[\''+field+'\']=this.checked">推定</label>' : '';
    return '<div class="item"><span class="nm">'+it.name+'</span>'
         + '<span class="side">'+(side||'')+'</span>'
         + '<input type="number" step="0.01" oninput="form[\''+field+'\']=this.value===\'\'?undefined:Number(this.value)">'
         + '<span class="unit">'+it.unit+'</span>'+e+'</div>';
  }
  return it.pair ? one(it.key+'_R','右')+one(it.key+'_L','左') : one(it.key,'');
}

/* ==================================================================
   採点
   ================================================================== */
function bandColor(pct){
  if(pct>=rule('flex_green_min',88.9)) return 'green';
  if(pct>=rule('flex_yellow_min',66.7)) return 'amber';
  return 'red';
}
function pointOf(key, value){
  var t = th(key);
  if(!t || value===undefined || value===null || value==='') return null;
  var v = Number(value);
  if(isNaN(v)) return null;
  if(v <= t.red) return 1;
  if(v >= t.green) return 3;
  return 2;
}
function bwRatio(key){
  var w = Number($('m_w').value);
  if(!w || form[key]===undefined) return null;
  return Math.round(form[key]/w*100)/100;
}

function score(){
  var d = {cats:{}, parts:{}, items:[], flags:[], jump:{}};

  // --- 柔軟性 ---
  var fSum=0, fMax=0;
  for(var p in FLEX){
    var s=0,m=0;
    FLEX[p].items.forEach(function(it){
      var v;
      if(it.pair){
        var R=form[it.key+'_R'], L=form[it.key+'_L'];
        if(R===undefined||L===undefined) v=(R!==undefined?R:L); else v=Math.min(R,L);
        if(R!==undefined && L!==undefined){
          var diff=Math.abs(R-L);
          if(diff>=rule('flex_lr_red',2)) d.flags.push({lv:'red', t:it.name+'の左右差が'+diff+'点あります（右'+R+'／左'+L+'）'});
          else if(diff>=rule('flex_lr_yellow',1)) d.flags.push({lv:'amber', t:it.name+'に左右差があります（右'+R+'／左'+L+'）'});
        }
      } else { v=form[it.key]; }
      if(v!==undefined){ s+=v; m+=3;
        d.items.push({cat:'柔軟性', name:it.name, val:v+' 点', pt:Math.max(1,Math.round(v/3*3)||1), raw:v, isFlex:true});
      }
    });
    if(m>0){ d.parts[p]=Math.round(s/m*1000)/10; fSum+=s; fMax+=m; }
  }
  if(fMax>0) d.cats.flex = Math.round(fSum/fMax*1000)/10;

  // --- 動きの質 ---
  var qs=0,qm=0;
  QUALITY.forEach(function(it){
    var v=form[it.key];
    if(v!==undefined){ qs+=v; qm+=3; d.items.push({cat:'動きの質', name:it.name, val:v+' 点', raw:v, isFlex:true}); }
  });
  if(qm>0) d.cats.quality = Math.round(qs/qm*1000)/10;

  // --- 実測系の共通処理 ---
  function runItems(list, bucket){
    var s=0,n=0;
    list.forEach(function(it){
      var fields = it.pair ? [it.key+'_R', it.key+'_L'] : [it.key];
      fields.forEach(function(f){
        var raw = form[f];
        if(raw===undefined) return;
        var v = it.bw ? bwRatio(f) : raw;
        var pt = pointOf(it.key, v);
        if(pt===null) return;
        s+=pt; n++;
        d.items.push({
          cat:bucket, name:it.name+(it.pair?(f.slice(-1)==='R'?'（右）':'（左）'):''),
          val: raw+' '+it.unit + (it.bw ? '（体重比 '+v+'）':'') + (est[f]?' ※推定':''),
          pt:pt
        });
      });
      // 左右差
      if(it.pair){
        var R=form[it.key+'_R'], L=form[it.key+'_L'];
        if(R!==undefined && L!==undefined && Math.max(R,L)>0){
          var diff = Math.round(Math.abs(R-L)/Math.max(R,L)*1000)/10;
          if(diff >= rule('asym_flag',10)){
            d.flags.push({lv:'red', t:it.name+'の左右差が'+diff+'%あります（右'+R+'／左'+L+'）。数値が高くても改善が必要です。'});
          }
        }
      }
    });
    return n>0 ? Math.round(s/(n*3)*1000)/10 : undefined;
  }

  d.cats.balance = runItems(MEASURED.balance.items, 'バランス');

  var ss=0, sn=0;
  MEASURED.strength.groups.forEach(function(g){
    var before = d.items.length;
    runItems(g.items, '筋力・'+g.sub);
    var added = d.items.slice(before);
    added.forEach(function(a){ if(a.pt){ ss+=a.pt; sn++; } });
    var gs=0, gn=0;
    added.forEach(function(a){ if(a.pt){ gs+=a.pt; gn++; } });
    if(gn>0) d.parts['str_'+g.sub] = Math.round(gs/(gn*3)*1000)/10;
  });
  if(sn>0) d.cats.strength = Math.round(ss/(sn*3)*1000)/10;

  d.cats.jump = runItems(MEASURED.jump.items, 'ジャンプ');

  // --- ジャンプの中身 ---
  var sqj=form.sqj, cmj=form.cmj, abj=form.abj;
  if(sqj && cmj){
    var r1 = Math.round((cmj-sqj)/sqj*1000)/10;
    d.jump.sscRate = r1;
    var tgt = rule('sqj_to_cmj_target',10);
    d.jump.ssc = r1 < tgt*0.3
      ? '反動をほとんど使えていません。伸張反射（SSC）が機能しておらず、筋力をそのまま跳躍に変換している状態です。'
      : (r1 > tgt*1.5
        ? '反動の使い方は非常に上手いものの、筋力そのものが不足しています。SQJを引き上げれば、CMJも連動して伸びます。'
        : '反動と筋力のバランスは標準的です。');
  }
  if(cmj && abj){
    var r2 = Math.round((abj-cmj)/cmj*1000)/10;
    d.jump.armRate = r2;
    var lo = rule('cmj_to_abj_low',5), hi = rule('cmj_to_abj_high',11);
    d.jump.arm = r2 < lo
      ? '腕振りと上半身の連動が機能していません。上半身の力を下半身に伝えられていない状態です。'
      : (r2 > hi
        ? '腕振りの連動は良好です。同時に、CMJ側にはまだ伸びしろがあります。'
        : '腕振りの連動は標準的です。');
  }
  if(cmj){
    var target = Math.round(cmj*rule('slcmj_target_ratio',50)/100*10)/10;
    d.jump.slTarget = target;
    ['R','L'].forEach(function(s){
      var v=form['sl_cmj_'+s];
      if(v===undefined) return;
      var pct = Math.round(v/target*1000)/10;
      if(pct < rule('slcmj_red_ratio',90)){
        d.flags.push({lv:'red', t:'SLCMJ '+(s==='R'?'右':'左')+' が目標の'+target+'cmに届いていません（'+v+'cm）。その側の片脚筋力、または片脚での伸張反射が不十分です。'});
      }
    });
  }
  var hr=form.hop_rsi, dr=form.drop_rsi;
  if(hr && dr && Math.max(hr,dr)>0){
    var rd = Math.round(Math.abs(hr-dr)/Math.max(hr,dr)*1000)/10;
    if(rd >= rule('rsi_diff_flag',15)){
      d.flags.push({lv:'amber', t:'ホップテストとドロップジャンプのRSIに'+rd+'%の差があります（'+hr+' / '+dr+'）。'});
    }
  }
  ['hop_rsi','drop_rsi'].forEach(function(k){
    if(form[k] && form[k] >= rule('rsi_excellent',3.1)){
      d.flags.push({lv:'green', t:(k==='hop_rsi'?'ホップテスト':'ドロップジャンプ')+'のRSIが'+form[k]+'。非常に良い数値です。'});
    }
  });

  // --- 総合 ---
  var tot=0, tn=0;
  CATS.forEach(function(c){ if(d.cats[c.key]!==undefined){ tot+=d.cats[c.key]; tn++; } });
  d.total = tn>0 ? Math.round(tot/tn*10)/10 : 0;
  return d;
}

/* ==================================================================
   画面3：結果
   ================================================================== */
function render(d){
  result = d;
  $('r_name').textContent = member.name;
  $('r_tag').textContent = [member.sport, (band()==='adult'?'17歳以上':'16歳以下'),
                            (history.length+1)+'回目'].filter(Boolean).join(' / ');
  $('r_total').textContent = d.total;

  // バー
  var C={green:'#3B8F68',amber:'#D89A1F',red:'#C7453F'};
  $('r_bars').innerHTML = CATS.map(function(c){
    var v=d.cats[c.key];
    if(v===undefined) return '<div class="bar"><div class="top"><span>'+c.label+'</span><span class="empty">未測定</span></div><div class="track"></div></div>';
    var col=bandColor(v);
    return '<div class="bar"><div class="top"><span>'+c.label+'</span>'
         + '<span class="num" style="color:'+C[col]+';font-weight:700">'+v+'</span></div>'
         + '<div class="track"><div class="fill" style="width:'+v+'%;background:'+C[col]+'"></div></div></div>';
  }).join('');

  // レーダー
  var labels=[], vals=[];
  CATS.forEach(function(c){ labels.push(c.label); vals.push(d.cats[c.key]===undefined?0:d.cats[c.key]); });
  if(radarChart) radarChart.destroy();
  radarChart = new Chart($('radar'), {
    type:'radar',
    data:{labels:labels, datasets:[{
      data:vals, fill:true,
      backgroundColor:'rgba(22,32,43,.12)', borderColor:'#16202B', borderWidth:2,
      pointBackgroundColor:vals.map(function(v){return C[bandColor(v)]}),
      pointRadius:5, pointBorderColor:'#fff', pointBorderWidth:2
    }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{r:{min:0,max:100,ticks:{stepSize:25,backdropColor:'transparent',color:'#8A94A0',font:{size:10}},
        grid:{color:'#D3D7DC'}, angleLines:{color:'#D3D7DC'},
        pointLabels:{font:{size:13,family:'Zen Kaku Gothic New',weight:'700'},color:'#16202B'}}}
    }
  });

  // ジャンプ
  var j=d.jump, jh='';
  if(j.sscRate!==undefined) jh += '<div class="note"><strong>反動の使い方（SQJ→CMJ '+j.sscRate+'%）</strong><br>'+j.ssc+'</div>';
  if(j.armRate!==undefined) jh += '<div class="note"><strong>腕振りの連動（CMJ→ABJ '+j.armRate+'%）</strong><br>'+j.arm+'</div>';
  if(j.slTarget!==undefined) jh += '<div class="note"><strong>片脚の目標値</strong><br>両脚CMJの半分にあたる '+j.slTarget+'cm が片脚の目標です。</div>';
  $('r_jump').innerHTML = jh || '<p class="empty">ジャンプ種目が未入力です。</p>';

  // フラグ
  var LV={red:['c-red','要改善'],amber:['c-amber','注意'],green:['c-green','良好']};
  $('r_flags').innerHTML = d.flags.length
    ? d.flags.map(function(f){return '<li><span class="chip '+LV[f.lv][0]+'">'+LV[f.lv][1]+'</span> '+esc(f.t)+'</li>'}).join('')
    : '<li class="empty">大きな偏りは見つかりませんでした。</li>';

  // 項目表
  var byCat={};
  d.items.forEach(function(i){ (byCat[i.cat]=byCat[i.cat]||[]).push(i); });
  var ih='';
  for(var c in byCat){
    ih += '<h3>'+c+'</h3><table class="res"><tr><th>種目</th><th>結果</th><th style="width:70px">判定</th></tr>';
    ih += byCat[c].map(function(i){
      var col, lab;
      if(i.isFlex){ col = i.raw>=3?'green':(i.raw>=2?'amber':'red'); lab = i.raw>=3?'良好':(i.raw>=2?'普通':'要改善'); }
      else { col = i.pt===3?'green':(i.pt===2?'amber':'red'); lab = i.pt===3?'良好':(i.pt===2?'普通':'要改善'); }
      return '<tr><td>'+esc(i.name)+'</td><td class="v num">'+esc(i.val)+'</td>'
           + '<td><span class="chip c-'+col+'">'+lab+'</span></td></tr>';
    }).join('');
    ih += '</table>';
  }
  $('r_items').innerHTML = ih || '<p class="empty">入力された項目がありません。</p>';

  // 推移
  if(history.length===0){
    $('r_trendWrap').innerHTML = '<p class="empty">今回が1回目です。2回目の測定から、ここに推移が出ます。</p>';
  } else {
    $('r_trendWrap').innerHTML = '<canvas id="trend" height="220"></canvas>';
    var pts = history.map(function(h){return Number(h.score_total)||0}).concat([d.total]);
    var lbs = history.map(function(h){return h.session_no+'回目'}).concat([(history.length+1)+'回目']);
    if(trendChart) trendChart.destroy();
    trendChart = new Chart($('trend'), {
      type:'line',
      data:{labels:lbs, datasets:[{data:pts, borderColor:'#16202B', backgroundColor:'rgba(22,32,43,.08)',
        fill:true, tension:.25, pointRadius:5, pointBackgroundColor:'#D89A1F', pointBorderColor:'#fff', pointBorderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{y:{min:0,max:100,grid:{color:'#E3E5E9'}},x:{grid:{display:false}}}}
    });
  }
  go(3);
}

function scoreOnly(){ render(score()); }

function saveMeasurement(){
  var d = score();
  var payload = {
    member_id: member.member_id,
    measured_at: $('m_date').value,
    height: $('m_h').value, weight: $('m_w').value, body_fat: $('m_bf').value,
    trainer: $('m_tr').value, injury: $('m_inj').value,
    estimated_items: Object.keys(est).filter(function(k){return est[k]}),
    score_flex: d.cats.flex, score_balance: d.cats.balance, score_strength: d.cats.strength,
    score_jump: d.cats.jump, score_quality: d.cats.quality, score_total: d.total,
    risk_flags: d.flags.filter(function(f){return f.lv==='red'}).length + '件'
  };
  for(var k in form){ payload[k] = form[k]; }
  post({action:'saveMeasurement', measurement:payload}).then(function(r){
    if(!r.ok){ fail('測定の保存', r.error||'不明なエラー'); return; }
    toast('保存しました');
    render(d);
  }).catch(function(e){ fail('測定の保存', e); });
}

boot();
</script>
